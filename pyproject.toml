[project]
name = "beyond-chatgpt"
version = "0.1.0"
description = "gpt-like-a-dev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "jupyter>=1.1.1",
    "openai",
    "pydantic>=2.11.4",
    "together>=1.5.25",
    "uvicorn>=0.34.2",
    "python-multipart>=0.0.18",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.1.1",
    "numpy>=1.24.0",
    "pdfplumber>=0.11.7",
    "pymupdf>=1.26.4",
]

[tool.setuptools.packages.find]
include = ["aimakerspace*"]
